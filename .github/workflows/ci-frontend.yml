# .github/workflows/ci-frontend.yml

name: Frontend CI (Pull Request)

on:
  # Trigger this workflow for each push to main and dev, and for each pull requests targeting main or dev
  push:
    branches:
      - main
      - dev
    paths:
      # Only run if files in the products directory have changed
      - "front/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "front/**"

# Define global settings for the job
defaults:
  run:
    # Set the default working directory to the frontend folder
    working-directory: front

jobs:
  ci:
    name: Lint, Type Check, Build, and Test # split buil with type scheck for SWC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        # Use npm ci for clean and fast installation in CI environments
        run: npm install

      - name: Run ESLint
        # Executes the "lint" script defined in front/package.json
        run: npm run lint

      - name: Run Type Check
        # Executes a new "type-check" script (e.g., tsc --noEmit)
        run: npm run type-check

      - name: Build Project
        # Executes the "build" script (tsc -b && vite build) defined in front/package.json
        run: npm run build

      # You can add a dedicated step for unit tests here (e.g., npm run test) if you add a test script later.
      # For a basic CI, running the build step is often sufficient to verify project integrity.
